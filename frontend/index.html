<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <link rel="stylesheet" href="/frontend/login.css"/>
  <link rel="stylesheet" href="/frontend/sidepanel.css"/>
  <script src="/frontend/login.js"></script>
  <title>FlowBoard - Connexion</title>
</head>
<body>
  <div id="login-popup">
    <div id="login-popup-background">
      <h1 class="conthrax-semibold">Bienvenue sur <span class="AkiraBold-Salt">FlowBoard</span></h1>
      <div id="login-popup-background-content">
        <p><i class="conthrax-semibold">Votre tableau de bord personnel tout-en-un</i></p>
      </div>
    </div>
    <div id="login-popup-content">
      <h1>User login</h1>
      <input id="username" type="text" name="username" placeholder="Nom d'utilisateur" />
      <input id="password" type="password" name="password" placeholder="Mot de passe" />
      <button type="button" onclick="login()">Se connecter</button>  
      <p id="error-message"></p>
    </div>
  </div>
</body>
</html>

<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no "/>
  <link rel="stylesheet" href="/frontend/style.css"/>
  <link rel="stylesheet" href="/frontend/finances.css" />
  <script src="/frontend/auth.js"></script>
  <script src="/frontend/sidepanel.js"></script>
  <script src="/frontend/finances.js"></script>
  <title>FlowBoard - Finances</title>
</head>
<body>
  <!-- on utilise un id pour cibler facilement -->
  <div id="sidepanel"></div>

  <div class="popup-overlay" id="popup-1" style="display: none;">
    <div class="popup">
      <h2>Ajout de nouveaux flux</h2>

      <div class="popup-content">
        <p class="input-title">Catégorie</p>
        <input type="text" id="category" placeholder="Catégorie"><br>
        <p class="input-title">Montant</p>
        <input type="number" id="amount" placeholder="Montant"><br>
        <p class="input-title">Date</p>
        <input type="date" id="date"><br>
        <button id="close-popup-1" onclick="closePopup()" style="background-color: var(--red-pastel-color);">Retour</button>
        <button id="inflow-button" onclick="add_flow()" style="background-color: var(--green-pastel-color);">Ajouter</button>
      </div>
    </div>
  </div>


  <div class="main">
    <header class="main-header" id="main-header">
      <h1>💵 Finances</h1>
      <div class="main-header-right">
        <button onclick="logout()"><img src="icons/logout.png" alt="Logout"></button>
      </div>
    </header>

    <main class="main-content">
      <div id="left-container">
        <div id="left-container-graph">
          <p id="left-container-graph-title" class="title-sticky">Graphique des finances</p>
          <img id="graph-img" alt="En cours de chargement..." />
        </div>
        <div id="left-container-data">
          <p id="left-container-data-title" class="title-sticky">Suivie du budget</p>
          <div id="data-container">
            <div id="data-left">
              
              <div class="data-month data-month-header">
                <p class="month-name">Mois</p>
                <p class="month-amount">Montant</p>
                <p class="month-percent">%</p>
              </div>
              <!-- Les données seront ajoutées ici dynamiquement -->

            </div>
            <div id="data-right">
              <p>Mois en cours</p>
              <p>Total</p>
              <p id="current-month-amount">???.??€</p>
              <p id="current-month-budget">???€</p>
              <div class="usage-percent">
                <p>   CE MOIS-CI </p>
                <p id="current-month-percent">??.??%</p>
              </div>
            </div>
          </div>
        </div>
      </div>
      <div id="right-container">
        <div id="right-container-top">
            <div id="right-container-title" class="title-sticky"><p>Historique des derniers flux</p></div>
        </div>
      </div>
    </main>
  </div>

  <script>
    fetchSidepanel() 
    get_graph()
    get_history()
    get_months()
    get_actual_month() 
  </script>
</body>
</html>

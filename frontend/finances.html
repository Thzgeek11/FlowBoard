<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no "/>
  <link rel="stylesheet" href="/frontend/finances.css" />
  <script src="/frontend/sidepanel.js"></script>
  <script src="/frontend/finances.js"></script>
  <title>FlowBoard - Finances</title>
</head>
<body>
  <!-- on utilise un id pour cibler facilement -->
  <div id="sidepanel"></div>

  <div class="main">
    <header class="main-header" id="main-header">
      <h1>💵 Finances</h1>
      <div class="main-header-right">
        <button aria-label="logout" onclick="window.location.href = '/frontend/index.html'"><img src="icons/logout.png" alt="Logout"></button>
      </div>
    </header>

    <main class="main-content">
      <div id="graph-container">
        <p id="graph-container-subtitle" class="title-sticky">Graphique des finances</p>
        <img id="graph-img" alt="En cours de chargement..." />
      </div>
      <div id="right-container">
        <div id="right-container-top">
            <p id="right-container-title" class="title-sticky">Historique des derniers flux</p>
            <p>En cours de chargement...</p>
        </div>
        <div id="right-container-bottom">
            <p class="title-sticky">Ajout de nouveaux flux</p>
            <div class="input-title">Catégorie</div>
            <input type="text" id="category" placeholder="Catégorie"><br>
            <div class="input-title">Montant</div>
            <input type="number" id="amount" placeholder="Montant"><br>
            <div class="input-title">Date</div>
            <input type="date" id="date"><br>
            <p id="error-message">Oh, you found me !</p>
            <button id="inflow-button" onclick="add_flow()">Ajouter</button>
        </div>
      </div>
    </main>
  </div>

  <script>
    get_graph()
    get_history()

    // fetch sidepanel.html et insertion dans #sidepanel
    fetch('/frontend/sidepanel.html')
      .then(res => {
        if (!res.ok) throw new Error('Erreur chargement sidepanel: ' + res.status);
        return res.text();
      })
      .then(html => document.getElementById('sidepanel').innerHTML = html)
      .catch(err => {
        console.error(err);
        // fallback minimal si fetch échoue
        document.getElementById('sidepanel').innerHTML =
          '<nav><a href="/frontend/dashboard.html">Dashboard</a></nav>';
      });
      
      const input = document.getElementById("date");
      const today = new Date();
      const yyyy = today.getFullYear();
      const mm = String(today.getMonth() + 1).padStart(2, '0'); // mois sur 2 chiffres
      const dd = String(today.getDate()).padStart(2, '0'); // jour sur 2 chiffres
      input.value = `${yyyy}-${mm}-${dd}`;

  </script>
</body>
</html>
